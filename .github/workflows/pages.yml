name: 建置並發佈 ABAP 圖書館

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 建置 index.html
        working-directory: src
        run: python build.py

      - name: 機密掃描（清單來自 repo secret SECRETSCAN_DENY）
        working-directory: src
        env:
          SECRETSCAN_DENY: ${{ secrets.SECRETSCAN_DENY }}
        run: python secretscan.py sections/*.html

      - name: 瀏覽器冒煙測試
        working-directory: src
        run: |
          pip install --quiet playwright
          python verify.py

      - name: 準備發佈目錄
        run: mkdir _site && cp index.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
